name: CI/CD

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build, Test & Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Calculate Version
        id: version
        shell: pwsh
        run: |
          $ref = "${{ github.ref }}"
          if ($ref -like 'refs/tags/v*') {
              $ver = "${{ github.ref_name }}".Substring(1)
          } else {
              $ver = "1.0.${{ github.run_number }}"
          }
          Write-Host "Calculated version: $ver"
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT

      # ---------------------------------------------------------
      # 1. TEST & BUILD (Runs on EVERY push/PR)
      # dotnet test automatically restores and builds before testing
      # We pass the Version so the compiled DLLs get the right version
      # ---------------------------------------------------------
      
      - name: Test & Build Shared
        run: dotnet test Shared/Shared.slnx -c Release -p:Version=${{ steps.version.outputs.VERSION }} --verbosity normal

      - name: Test & Build Hub
        run: dotnet test Hub/Hub.slnx -c Release -p:Version=${{ steps.version.outputs.VERSION }} --verbosity normal

      - name: Test & Build Providers
        run: dotnet test Providers/Providers.slnx -c Release -p:Version=${{ steps.version.outputs.VERSION }} --verbosity normal

      # ---------------------------------------------------------
      # 2. PUBLISH & RELEASE (Runs ONLY on --build or tags)
      # Uses --no-build since the code was already compiled by dotnet test
      # ---------------------------------------------------------

      - name: Publish Hub
        if: contains(github.event.head_commit.message, '--build') || startsWith(github.ref, 'refs/tags/')
        run: dotnet publish Hub/Hub/Hub.csproj -c Release --no-build -p:Version=${{ steps.version.outputs.VERSION }} -o ./publish-output

      - name: Publish Providers Dynamically
        if: contains(github.event.head_commit.message, '--build') || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $providerDirs = Get-ChildItem -Path Providers -Directory
          foreach ($dir in $providerDirs) {
              $name = $dir.Name
              if ($name -in @('DemoProvider', 'BaseProvider', 'WebBaseProvider')) { continue }
              
              $csprojPath = "Providers/$name/$name/$name.csproj"
              if (Test-Path $csprojPath) {
                  Write-Host "Publishing $name..."
                  # --no-build skips compiling again
                  dotnet publish $csprojPath -c Release --no-build -p:Version=${{ steps.version.outputs.VERSION }} -o "./publish-output/Providers/$name"
              }
          }

      - name: Copy Prerequisite Installer
        if: contains(github.event.head_commit.message, '--build') || startsWith(github.ref, 'refs/tags/')
        run: Copy-Item ./scripts/Install-Prerequisites.ps1 ./publish-output/
        shell: pwsh

      - name: Zip Output
        if: contains(github.event.head_commit.message, '--build') || startsWith(github.ref, 'refs/tags/')
        run: Compress-Archive -Path ./publish-output/* -DestinationPath ./WindowsSearch-${{ steps.version.outputs.VERSION }}.zip
        shell: pwsh

      - name: Upload Artifact
        if: contains(github.event.head_commit.message, '--build') || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: WindowsSearch-${{ steps.version.outputs.VERSION }}
          path: ./WindowsSearch-${{ steps.version.outputs.VERSION }}.zip
          retention-days: 30

      - name: Create GitHub Release
        if: contains(github.event.head_commit.message, '--build') || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Release v${{ steps.version.outputs.VERSION }}
          files: ./WindowsSearch-${{ steps.version.outputs.VERSION }}.zip
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          generate_release_notes: true
